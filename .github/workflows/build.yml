name: Build & Distribute APK & IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    # Context `secrets` KHÔNG dùng được trong `if` (workflow bị coi là không hợp
    # lệ và fail 0s) — đưa ra env cấp job rồi so sánh biến env.
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edupulse-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload APK to Firebase
        if: env.FIREBASE_TOKEN != ''
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app ${{ secrets.FIREBASE_ANDROID_APP_ID }} \
            --token ${{ secrets.FIREBASE_TOKEN }} \
            --groups testers

  build-ios:
    runs-on: macos-latest
    # Cùng lý do như build-android: secrets chỉ dùng được qua env trong `if`.
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build unsigned Runner.app (no codesign)
        # Công thức giống `ios-ipa.yml` (đã chạy thành công trước đó):
        # `flutter build ipa --no-codesign` KHÔNG sinh file .ipa (chỉ archive),
        # nên phải xcodebuild rồi tự đóng gói Payload.
        run: |
          flutter precache --ios
          flutter build ios --config-only --release --no-codesign --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA (Payload + zip)
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry EduPulse-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edupulse-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload IPA to Firebase
        if: env.FIREBASE_TOKEN != ''
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute build/ios/ipa/*.ipa \
            --app ${{ secrets.FIREBASE_IOS_APP_ID }} \
            --token ${{ secrets.FIREBASE_TOKEN }} \
            --groups testers
