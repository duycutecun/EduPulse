name: Build & Distribute APK & IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    # Context `secrets` KHÔNG dùng được trong `if` (workflow bị coi là không hợp
    # lệ và fail 0s) — đưa ra env cấp job rồi so sánh biến env.
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edupulse-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to Firebase
        if: env.FIREBASE_TOKEN != ''
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app ${{ secrets.FIREBASE_ANDROID_APP_ID }} \
            --token ${{ secrets.FIREBASE_TOKEN }} \
            --groups testers

  build-ios:
    runs-on: macos-latest
    # Cùng lý do như build-android: secrets chỉ dùng được qua env trong `if`.
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build IPA
        run: flutter build ipa --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --no-codesign

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edupulse-ipa
          path: build/ios/ipa/*.ipa

      - name: Upload IPA to Firebase
        if: env.FIREBASE_TOKEN != ''
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute build/ios/ipa/*.ipa \
            --app ${{ secrets.FIREBASE_IOS_APP_ID }} \
            --token ${{ secrets.FIREBASE_TOKEN }} \
            --groups testers
