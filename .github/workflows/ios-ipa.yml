name: iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

  build:
    runs-on: macos-latest
    needs: test
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java (Android toolchain nếu cần)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install dependencies
        run: flutter pub get

      # ────────────────────────────────────────────────────────────────────
      # Build-time config: KHÔNG truyền = IPA "rỗng cấu hình" (không Supabase
      # → không database, không OpenRouter/Gemini → AI báo "chưa cấu hình key",
      # không Firebase → không đăng nhập). Web có các giá trị này qua Vercel
      # (build.sh); bản iOS lấy từ GitHub Secrets cùng tên.
      #
      # Thêm tại: Settings → Secrets and variables → Actions → New repository
      # secret. Thiếu secret nào thì bước này BÁO CẢNH BÁO (không làm hỏng
      # build) và liệt kê tên secret còn thiếu ngay trong log + Summary.
      # ────────────────────────────────────────────────────────────────────
      - name: Configure Flutter iOS project (no codesign + build-time config)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail

          DEFINES=()
          MISSING=()
          add() {
            local name="$1"
            local value="${2-}"
            if [ -n "$value" ]; then
              DEFINES+=("--dart-define=$name=$value")
            else
              MISSING+=("$name")
            fi
          }

          add OPENROUTER_API_KEY "${OPENROUTER_API_KEY-}"
          add GEMINI_API_KEY "${GEMINI_API_KEY-}"
          add TAVILY_API_KEY "${TAVILY_API_KEY-}"
          add SUPABASE_URL "${SUPABASE_URL-}"
          add SUPABASE_ANON_KEY "${SUPABASE_ANON_KEY-}"
          add FIREBASE_API_KEY "${FIREBASE_API_KEY-}"
          add FIREBASE_AUTH_DOMAIN "${FIREBASE_AUTH_DOMAIN-}"
          add FIREBASE_PROJECT_ID "${FIREBASE_PROJECT_ID-}"
          add FIREBASE_STORAGE_BUCKET "${FIREBASE_STORAGE_BUCKET-}"
          add FIREBASE_MESSAGING_SENDER_ID "${FIREBASE_MESSAGING_SENDER_ID-}"
          add FIREBASE_APP_ID "${FIREBASE_APP_ID-}"

          # Chỉ in TÊN, không bao giờ in giá trị secret.
          echo "Đã nạp ${#DEFINES[@]}/11 cấu hình build cho bản iOS."
          {
            echo "### Cấu hình build của IPA"
            echo ""
            echo "- Đã nạp: ${#DEFINES[@]}/11"
            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "- ⚠️ Còn thiếu (tính năng tương ứng sẽ trống): ${MISSING[*]}"
            else
              echo "- ✅ Đủ toàn bộ cấu hình."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning title=IPA thiếu cấu hình::Chưa có secret: ${MISSING[*]}. Bản cài ra sẽ không kết nối được database/AI tương ứng. Người dùng vẫn có thể tự dán key trong app: Tôi → Cloud & AI."
          fi

          flutter precache --ios
          # `--dart-define` được ghi vào ios/Flutter/Generated.xcconfig nên
          # xcodebuild ở bước sau (xcode_backend.sh) đóng gói luôn vào app.
          flutter build ios --config-only --release --no-codesign ${DEFINES[@]+"${DEFINES[@]}"}

      - name: Build unsigned Runner.app with xcodebuild
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA (Payload + zip)
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry EduPulse-unsigned.ipa Payload
          rm -rf Payload
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: edupulse-ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error
