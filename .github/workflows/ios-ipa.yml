name: iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

  build:
    runs-on: macos-latest
    needs: test
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java (Android toolchain nếu cần)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Flutter iOS project (no codesign)
        run: |
          flutter precache --ios
          flutter build ios --config-only --release --no-codesign

      - name: Build unsigned Runner.app with xcodebuild
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA (Payload + zip)
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry EduPulse-unsigned.ipa Payload
          rm -rf Payload
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: edupulse-ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error
