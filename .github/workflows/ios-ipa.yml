name: iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      SUPABASE_URL:
        description: 'Supabase URL (xem .env)'
        required: false
      SUPABASE_ANON_KEY:
        description: 'Supabase anon key (xem .env)'
        required: false

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

  build:
    runs-on: macos-latest
    needs: test
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java (Android toolchain nếu cần)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Install dependencies
        run: flutter pub get

      # ────────────────────────────────────────────────────────────────────
      # Build-time config: KHÔNG truyền = IPA "rỗng cấu hình" (không Supabase
      # → không database, không đăng nhập — xác thực giờ chỉ cần Supabase).
      # Khoá AI (OpenRouter/Gemini/Tavily) KHÔNG còn nhúng vào app: AI managed
      # đi qua backend serverless (bản deploy trong AppConfig.apiBaseUrl) —
      # bản cài chỉ cần có mạng; người dùng vẫn có thể tự dán key BYOK trong
      # Tôi → Cloud & AI.
      #
      # Thiếu key nào thì bước này BÁO CẢNH WARNING (không làm hỏng build) và liệt
      # kê tên key còn thiếu ngay trong log + Summary.
      # ────────────────────────────────────────────────────────────────────
      - name: Configure Flutter iOS project (no codesign + build-time config)
        env:
          SUPABASE_URL: ${{ inputs.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ inputs.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          DEFINES=()
          MISSING=()
          add() {
            local name="$1"
            local value="${2-}"
            if [ -n "$value" ]; then
              DEFINES+=("--dart-define=$name=$value")
            else
              MISSING+=("$name")
            fi
          }

          add SUPABASE_URL "${SUPABASE_URL-}"
          add SUPABASE_ANON_KEY "${SUPABASE_ANON_KEY-}"

          # Chỉ in TÊN, không bao giờ in giá trị secret.
          echo "Đã nạp ${#DEFINES[@]}/2 cấu hình build cho bản iOS."
          {
            echo "### Cấu hình build của IPA"
            echo ""
            echo "- Đã nạp: ${#DEFINES[@]}/2"
            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "- ⚠️ Còn thiếu (tính năng tương ứng sẽ trống): ${MISSING[*]}"
            else
              echo "- ✅ Đủ toàn bộ cấu hình."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning title=IPA thiếu cấu hình::Chưa có secret: ${MISSING[*]}. Bản cài ra sẽ không kết nối được database/đăng nhập tương ứng. (AI managed đi qua backend, không phụ thuộc key nhúng; người dùng vẫn có thể tự dán key BYOK trong app: Tôi → Cloud & AI.)"
          fi

          flutter precache --ios
          # `--dart-define` được ghi vào ios/Flutter/Generated.xcconfig nên
          # xcodebuild ở bước sau (xcode_backend.sh) đóng gói luôn vào app.
          flutter build ios --config-only --release --no-codesign ${DEFINES[@]+"${DEFINES[@]}"}

      - name: Build unsigned Runner.app with xcodebuild
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA (Payload + zip)
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry EduPulse-unsigned.ipa Payload
          rm -rf Payload
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: edupulse-ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error
