name: edupulse
description: "EduPulse — Trợ lý Sĩ tử & Đếm ngược Kỳ thi (THPTQG, TSA, HSA, HSG)"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  http: ^1.1.0
  file_picker: ^12.1.2
  supabase_flutter: ^2.8.0
  flutter_math_fork: ^0.7.0
  flutter_local_notifications: ^22.3.0
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Nunito bundle local — không tải font từ mạng khi mở app (web/PWA
  # load nhanh hơn, không bị nháy chữ, dùng được cả khi offline).
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-500.ttf
          weight: 500
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
