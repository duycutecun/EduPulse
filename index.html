  <style>
    html, body {

      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;

    }
  </style>

<body style="background-color: #F7F7F7; margin: 0; padding: 0;">
  <script src="flutter_bootstrap.js" async></script>

  <!-- Custom offline-first service worker (Flutter's built-in SW is deprecated in recent versions) -->
  <script>
    (function () {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('service-worker.js').catch(function (err) {
            console.warn('EduPulse service worker registration failed:', err);
          });
        });
      }
    })();
  </script>

  <!-- PWA install support: Android/Chrome install prompt + iOS add-to-home-screen bridge -->
  <script>
    (function () {
      var deferredPrompt = null;
      var canInstall = false;

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        canInstall = true;
        window.dispatchEvent(new CustomEvent('pwa-installable'));
      });

      window.addEventListener('appinstalled', function () {
        canInstall = false;
        deferredPrompt = null;
      });

      // Called from Flutter to check installability
      window.pwaCanInstall = function () {
        return canInstall && !window.pwaIsStandalone();
      };

      // Called from Flutter to check if app is running in PWA standalone mode (iOS / Android installed)
      window.pwaIsStandalone = function () {
        try {
          return (window.navigator.standalone === true) ||
                 (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        } catch (_) {
          return false;
        }
      };

      // Called from Flutter to trigger native install prompt (Android/Chrome)
      window.pwaInstall = function () {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function (choice) {
            if (choice.outcome === 'accepted') {
              canInstall = false;
            }
            deferredPrompt = null;
          });
          return true;
        }
        return false;
      };
    })();
  </script>

  <!-- Offline/online status bridge (for "mất kết nối" banner) -->
  <script>
    (function () {
      window.eduPulseIsOnline = function () {
        return navigator.onLine;
      };

      // Báo lại cho Flutter khi trạng thái online/offline thay đổi.
      function broadcast() {
        var online = navigator.onLine;
        window.dispatchEvent(new CustomEvent('edu-pulse-online', { detail: online }));
      }

      window.addEventListener('online', broadcast);
      window.addEventListener('offline', broadcast);
    })();
  </script>
